
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Essential Content Helper</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    .btn { display: block; width: 100%; padding: 1rem; font-size: 1.1rem; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
    #preview { max-width: 100%; margin-top: 1rem; border-radius: 8px; display: none; }
    #output { margin-top: 1.5rem; padding: 1rem; background: #f3f4f6; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2>Bio Question Solver</h2>
  <p>Snap a clear photo of your essential content worksheet.</p>

  <!-- Opens phone camera directly -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
  <button class="btn" onclick="document.getElementById('cameraInput').click()">Take Photo / Upload</button>

  <img id="preview" alt="Worksheet preview">
  <div id="output">Answers will appear here...</div>

  <script>
    const API_KEY = "YOUR_GEMINI_API_KEY"; // Replace with your actual key
    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const output = document.getElementById('output');

    cameraInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      // Show image preview
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      output.textContent = "Reading questions and writing answers...";

      // Convert image to Base64
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];
        await getAnswers(base64Data, file.type);
      };
    });

    async function getAnswers(base64Image, mimeType) {
      const prompt = `Look at the biology questions in this image. Answer each numbered question clearly. 
      Rules:
      - Write like a normal high school student. 
      - Keep answers very short (1 to 2 sentences max).
      - Do not use overly formal vocabulary or robotic transitions.
      - Just list the question number and the answer.`;

      try {
        const response = await fetch(`https://googleapis.com{API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: mimeType, data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        output.textContent = data.candidates[0].content.parts[0].text;
      } catch (error) {
        output.textContent = "Error reading image. Make sure your API key is valid and try again.";
      }
    }
  </script>
</body>
</html>
