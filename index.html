<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Essential Content Helper</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
    }

    body {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #111827;
    }

    textarea {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 180px;
      margin: 1rem 0;
      padding: 0.8rem;
      font: inherit;
      border: 1px solid #9ca3af;
      border-radius: 8px;
      resize: vertical;
    }

    .btn {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 1rem;
      font-size: 1.1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #output {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f3f4f6;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .hint {
      color: #4b5563;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Bio Question Solver</h1>
  <p>Type or paste your biology question below.</p>
  <p class="hint">Your question is sent to an AI service for an answer.</p>

  <form id="questionForm">
    <label for="question">Your question</label>
    <textarea id="question" maxlength="8000" required placeholder="Type your biology question here..."></textarea>
    <button class="btn" id="askButton" type="submit">Get Answer</button>
  </form>

  <div id="output" role="status" aria-live="polite">Answers will appear here...</div>

  <script>
    const questionForm = document.getElementById("questionForm");
    const questionInput = document.getElementById("question");
    const askButton = document.getElementById("askButton");
    const output = document.getElementById("output");

    questionForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const prompt = questionInput.value.trim();
      if (!prompt) return;

      askButton.disabled = true;
      askButton.textContent = "Thinking...";
      output.textContent = "Getting an answer...";

      try {
        const response = await fetch("https://bio-content-ai.vercel.app/api/solve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `Server error (${response.status})`);
        }
        if (!data.answer) throw new Error("The AI returned no answer.");
        output.textContent = data.answer;
      } catch (error) {
        console.error("Question processing failed:", error);
        output.textContent = error.message || "Unable to get an answer. Please try again.";
      } finally {
        askButton.disabled = false;
        askButton.textContent = "Get Answer";
      }
    });
  </script>
</body>
</html>
