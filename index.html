<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Essential Content Helper</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
    }

    body {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #111827;
    }

    textarea {
      box-sizing: border-box;
      display: block;
      width: 100%;
      min-height: 180px;
      margin: 1rem 0;
      padding: 0.8rem;
      font: inherit;
      border: 1px solid #9ca3af;
      border-radius: 8px;
      resize: vertical;
    }

    .btn {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 1rem;
      font-size: 1.1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #output {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f3f4f6;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .hint {
      color: #4b5563;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Bio Question Solver</h1>
  <p>Type or paste your biology question below.</p>
  <p class="hint">Your question is sent to an AI service for an answer.</p>

  <form id="questionForm">
    <label for="question">Your question</label>
    <textarea id="question" maxlength="8000" required placeholder="Type your biology question here..."></textarea>
    <button class="btn" id="askButton" type="submit">Get Answer</button>
  </form>

  <div id="output" role="status" aria-live="polite">Answers will appear here...</div>


  <script>
    // Replaces the <script> block at the bottom of index.html.
    const BUILD = "text-v2"; // bump on every commit; check with: document.querySelector("script").textContent.includes('text-v2')
    const API_URL = "https://bio-content-ai.vercel.app/api/solve";

    const questionForm = document.getElementById("questionForm");
    const questionInput = document.getElementById("question");
    const askButton = document.getElementById("askButton");
    const output = document.getElementById("output");
    console.info("[bio] page build", BUILD);

    questionForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const prompt = questionInput.value.trim();
      if (!prompt) return;

      askButton.disabled = true;
      askButton.textContent = "Thinking...";
      output.textContent = "Getting an answer...";

      let response;
      try {
        response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });
      } catch (err) {
        // fetch() only rejects on network/CORS failure — the server's status is not visible here.
        console.error("[bio] network or CORS failure", err);
        output.textContent = "Could not reach the server (network or CORS). Check the console.";
        askButton.disabled = false;
        askButton.textContent = "Get Answer";
        return;
      }

      const data = await response.json().catch(() => ({}));
      console.info("[bio] api", response.status, "commit", response.headers.get("X-Solve-Commit"), data);

      if (response.ok && data.answer) {
        output.textContent = data.answer;
      } else {
        const detail = [data.code, data.reason, data.finishReason].filter(Boolean).join(" / ");
        output.textContent = (data.error || `Server error (${response.status})`) + (detail ? ` [${detail}]` : "");
      }

      askButton.disabled = false;
      askButton.textContent = "Get Answer";
    });
  </script>


</body>
</html>
