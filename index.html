<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Essential Content Helper</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
    }

    body {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #111827;
    }

    .btn {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 1rem;
      font-size: 1.1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #preview {
      max-width: 100%;
      max-height: 420px;
      margin-top: 1rem;
      border-radius: 8px;
      object-fit: contain;
      display: none;
    }

    #output {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f3f4f6;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .hint {
      color: #4b5563;
      font-size: 0.9rem;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Bio Question Solver</h1>
  <p>Snap a clear photo of your essential content worksheet.</p>
  <p class="hint">The image is sent to an AI service for processing.</p>

  <input
    type="file"
    id="cameraInput"
    accept="image/jpeg,image/png,image/webp"
    capture="environment"
    hidden
  >

  <button class="btn" id="uploadButton" type="button">
    Take Photo / Upload
  </button>

  <img id="preview" alt="Worksheet preview">

  <div id="output" role="status" aria-live="polite">
    Answers will appear here...
  </div>

  <script>
    const cameraInput = document.getElementById("cameraInput");
    const uploadButton = document.getElementById("uploadButton");
    const preview = document.getElementById("preview");
    const output = document.getElementById("output");

    let previewUrl;

    uploadButton.addEventListener("click", () => cameraInput.click());

    cameraInput.addEventListener("change", async () => {
      const file = cameraInput.files[0];
      if (!file) return;

      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        output.textContent = "Please select a JPG, PNG, or WebP image.";
        return;
      }

      // Base64 encoding increases the request size; keep within Vercel's request limit.
      if (file.size > 3 * 1024 * 1024) {
        output.textContent = "Please choose an image smaller than 3 MB.";
        return;
      }

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);

      preview.src = previewUrl;
      preview.style.display = "block";

      try {
        uploadButton.disabled = true;
        uploadButton.textContent = "Reading worksheet...";
        output.textContent = "Reading questions and writing answers...";

        await getAnswers(file);
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Take Another Photo";
        cameraInput.value = "";
      }
    });

    async function getAnswers(file) {
      try {
        const base64Image = await fileToBase64(file);
        const response = await fetch("https://bio-content-ai.vercel.app/api/solve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image: {
              mimeType: file.type,
              data: base64Image
            }
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || `Server error (${response.status})`);
        }

        if (!data.answer) {
          throw new Error("The AI returned no answer.");
        }

        output.textContent = data.answer;
      } catch (error) {
        console.error("Worksheet processing failed:", error);
        output.textContent = error.message ||
          "Unable to read this image. Try a brighter photo or upload it again.";
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          const result = String(reader.result);
          resolve(result.split(",")[1]);
        };

        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
